[package]
name = "cc-statusline"
version = "0.1.2"
edition = "2021"
description = "Customizable Claude Code statusline with rate-limit curves, context bar, and git info"
license = "MIT"
repository = "https://github.com/Team-MaRo/cc-statusline"

[[bin]]
name = "cc-statusline"
path = "src/main.rs"

[[example]]
name = "gen_svg"
path = "docs/gen_svg.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = { version = "0.10", features = ["filter-by-regex"] }
anyhow = "1"
rmcp = { version = "2.1", features = ["server", "macros", "transport-io"] }
schemars = "1"
tokio = { version = "1", features = ["macros", "rt", "io-std", "sync"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3
